# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

services:
  "gitlab.admin.ehealth.sundhed.dk": "gitlab:gitlab.admin.ehealth.sundhed.dk"
git:
  parseEmoji: true
  # Needed if you want to amend a signed commit and you are using an agent so you don't have to enter your passphrase again.
  overrideGpg: true
gui:
  nerdFontsVersion: "3"
  # https://github.com/catppuccin/lazygit/blob/main/themes/mocha/blue.yml
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
    authorColors:
      "*": "#b4befe"
customCommands:
  # https://gist.github.com/timhagel/28ae03354a85ce3e5237b308912b9b52
  - key: "C"
    command: 'git commit -m "{{ .Form.Type }}{{if .Form.Scope}}({{ .Form.Scope }}){{end}}: {{ .Form.Emoji }} {{ .Form.Description }}"'
    description: "conventional commit"
    context: "files"
    prompts:
      - type: "menu"
        title: "Select the type of change you are committing."
        key: "Type"
        options:
          - name: "Feature"
            description: "a new feature"
            value: "feat"
          - name: "Fix"
            description: "a bug fix"
            value: "fix"
          - name: "Documentation"
            description: "Documentation only changes"
            value: "docs"
          - name: "Styles"
            description: "Styling changes (white-space, formatting, etc)"
            value: "style"
          - name: "Code Refactoring"
            description: "Refactoring code"
            value: "refactor"
          - name: "Performance Improvements"
            description: "Performance improvements"
            value: "perf"
          - name: "Tests"
            description: "Test additions or fixes"
            value: "test"
          - name: "Builds"
            description: "Build system or dependency changes"
            value: "build"
          - name: "Continuous Integration"
            description: "CI configuration changes"
            value: "ci"
          - name: "Chores"
            description: "Other non-code changes"
            value: "chore"
          - name: "Reverts"
            description: "Reverting changes"
            value: "revert"
      - type: "menu"
        title: "Choose the emoji for this commit type."
        key: "Emoji"
        options:
          - name: "\U0001F3A8 Improve structure / format of the code."
            value: ":art:"
          - name: "⚡️ Improve performance."
            value: ":zap:"
          - name: "\U0001F525 Remove code or files."
            value: ":fire:"
          - name: "\U0001F41B Fix a bug."
            value: ":bug:"
          - name: "\U0001F691️ Critical hotfix."
            value: ":ambulance:"
          - name: "✨ Introduce new features."
            value: ":sparkles:"
          - name: "\U0001F4DD Add or update documentation."
            value: ":memo:"
          - name: "\U0001F680 Deploy stuff."
            value: ":rocket:"
          - name: "\U0001F484 Add or update the UI and style files."
            value: ":lipstick:"
          - name: "\U0001F389 Begin a project."
            value: ":tada:"
          - name: "✅ Add, update, or pass tests."
            value: ":white_check_mark:"
          - name: "\U0001F512️ Fix security or privacy issues."
            value: ":lock:"
          - name: "\U0001F510 Add or update secrets."
            value: ":closed_lock_with_key:"
          - name: "\U0001F516 Release / Version tags."
            value: ":bookmark:"
          - name: "\U0001F6A8 Fix compiler / linter warnings."
            value: ":rotating_light:"
          - name: "\U0001F6A7 Work in progress."
            value: ":construction:"
          - name: "\U0001F49A Fix CI Build."
            value: ":green_heart:"
          - name: "⬇️ Downgrade dependencies."
            value: ":arrow_down:"
          - name: "⬆️ Upgrade dependencies."
            value: ":arrow_up:"
          - name: "\U0001F4CC Pin dependencies to specific versions."
            value: ":pushpin:"
          - name: "\U0001F477 Add or update CI build system."
            value: ":construction_worker:"
          - name: "\U0001F4C8 Add or update analytics or track code."
            value: ":chart_with_upwards_trend:"
          - name: "♻️ Refactor code."
            value: ":recycle:"
          - name: "➕ Add a dependency."
            value: ":heavy_plus_sign:"
          - name: "➖ Remove a dependency."
            value: ":heavy_minus_sign:"
          - name: "\U0001F527 Add or update configuration files."
            value: ":wrench:"
          - name: "\U0001F528 Add or update development scripts."
            value: ":hammer:"
          - name: "\U0001F310 Internationalization and localization."
            value: ":globe_with_meridians:"
          - name: "✏️ Fix typos."
            value: ":pencil2:"
          - name: "\U0001F4A9 Write bad code that needs to be improved."
            value: ":poop:"
          - name: "⏪️ Revert changes."
            value: ":rewind:"
          - name: "\U0001F500 Merge branches."
            value: ":twisted_rightwards_arrows:"
          - name: "\U0001F4E6️ Add or update compiled files or packages."
            value: ":package:"
          - name: "\U0001F47D️ Update code due to external API changes."
            value: ":alien:"
          - name: "\U0001F69A Move or rename resources (e.g.: files, paths, routes)."
            value: ":truck:"
          - name: "\U0001F4C4 Add or update license."
            value: ":page_facing_up:"
          - name: "\U0001F4A5 Introduce breaking changes."
            value: ":boom:"
          - name: "\U0001F371 Add or update assets."
            value: ":bento:"
          - name: "♿️ Improve accessibility."
            value: ":wheelchair:"
          - name: "\U0001F4A1 Add or update comments in source code."
            value: ":bulb:"
          - name: "\U0001F37B Write code drunkenly."
            value: ":beers:"
          - name: "\U0001F4AC Add or update text and literals."
            value: ":speech_balloon:"
          - name: "\U0001F5C3️ Perform database related changes."
            value: ":card_file_box:"
          - name: "\U0001F50A Add or update logs."
            value: ":loud_sound:"
          - name: "\U0001F507 Remove logs."
            value: ":mute:"
          - name: "\U0001F465 Add or update contributor(s)."
            value: ":busts_in_silhouette:"
          - name: "\U0001F6B8 Improve user experience / usability."
            value: ":children_crossing:"
          - name: "\U0001F3D7️ Make architectural changes."
            value: ":building_construction:"
          - name: "\U0001F4F1 Work on responsive design."
            value: ":iphone:"
          - name: "\U0001F921 Mock things."
            value: ":clown_face:"
          - name: "\U0001F95A Add or update an easter egg."
            value: ":egg:"
          - name: "\U0001F648 Add or update a .gitignore file."
            value: ":see_no_evil:"
          - name: "\U0001F4F8 Add or update snapshots."
            value: ":camera_flash:"
          - name: "⚗️ Perform experiments."
            value: ":alembic:"
          - name: "\U0001F50D️ Improve SEO."
            value: ":mag:"
          - name: "\U0001F3F7️ Add or update types."
            value: ":label:"
          - name: "\U0001F331 Add or update seed files."
            value: ":seedling:"
          - name: "\U0001F6A9 Add, update, or remove feature flags."
            value: ":triangular_flag_on_post:"
          - name: "\U0001F945 Catch errors."
            value: ":goal_net:"
          - name: "\U0001F4AB Add or update animations and transitions."
            value: ":dizzy:"
          - name: "\U0001F5D1️ Deprecate code that needs to be cleaned up."
            value: ":wastebasket:"
          - name: "\U0001F6C2 Work on code related to authorization, roles and permissions."
            value: ":passport_control:"
          - name: "\U0001FA79 Simple fix for a non-critical issue."
            value: ":adhesive_bandage:"
          - name: "\U0001F9D0 Data exploration/inspection."
            value: ":monocle_face:"
          - name: "⚰️ Remove dead code."
            value: ":coffin:"
          - name: "\U0001F9EA Add a failing test."
            value: ":test_tube:"
          - name: "\U0001F454 Add or update business logic."
            value: ":necktie:"
          - name: "\U0001FA7A Add or update healthcheck."
            value: ":stethoscope:"
          - name: "\U0001F9F1 Infrastructure related changes."
            value: ":bricks:"
      - type: "input"
        title: "Enter optional scope of the change."
        key: "Scope"
      - type: "input"
        title: "Enter the short description of the change."
        key: "Description"
      - type: "confirm"
        title: "Is the commit message correct?"
        body: "{{ .Form.Type }}{{if .Form.Scope}}({{ .Form.Scope }}){{end}}: {{ .Form.Emoji }} {{ .Form.Description }}"
